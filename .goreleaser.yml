version: 2

project_name: git-why

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    binary: git-why

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

# Homebrew publishing is skipped unless HOMEBREW_TAP_GITHUB_TOKEN is set,
# so a GitHub release of the binaries still succeeds before the tap exists.
homebrew_casks:
  - name: git-why
    skip_upload: '{{ eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}'
    homepage: "https://github.com/Blancochuy/git-why"
    description: "Understand why code exists, not just who wrote it"
    license: MIT
    repository:
      owner: Blancochuy
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: blancochuy
      email: contact@blancochuy.dev
    directory: Casks
    dependencies:
      - formula: git
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/git-why"]
          end

nfpms:
  - package_name: git-why
    vendor: blancochuy
    homepage: https://github.com/Blancochuy/git-why
    maintainer: blancochuy <contact@blancochuy.dev>
    description: Understand why code exists, not just who wrote it
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - git

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Blancochuy
    name: git-why
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## git-why {{.Version}}

    See [CHANGELOG.md](CHANGELOG.md) for details.
  footer: |
    **Full Changelog**: https://github.com/Blancochuy/git-why/compare/{{ .PreviousTag }}...{{ .Tag }}
