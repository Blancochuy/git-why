name: CI

on:
  push:
    branches: [main, feature/ai-integration]
  pull_request:
    branches: [main, feature/ai-integration]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o git-why .

      - name: Version
        run: ./git-why --version
